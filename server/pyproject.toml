[project]
name = "sopkoll"
version = "0.1.0"
description = "Sopkoll server: SVOA schedule proxy, anonymous push devices, and the reminder scheduler"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pywebpush>=2.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
